# Tests always use their own database, independently of DB_NAME (development).
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55440}/${TEST_DB_NAME:acopio_test}
spring.datasource.username=${DB_USERNAME:acopio_dev}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.default-schema=public
spring.flyway.clean-disabled=true
app.jwt.secret=${random.uuid}${random.uuid}
app.jwt.expiration-ms=86400000
server.address=127.0.0.1
server.error.include-message=never

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
