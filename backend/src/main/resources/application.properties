spring.application.name=acopio
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.address=127.0.0.1
server.port=${SERVER_PORT:18080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55440}/${DB_NAME:acopio_dev}
spring.datasource.username=${DB_USERNAME:acopio_dev}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.default-schema=public
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Valores del piloto: no representan limites oficiales certificados.
app.calidad.version=${CALIDAD_VERSION:DEMO-1}
app.calidad.temperatura.min=${CALIDAD_TEMPERATURA_MIN:2.00}
app.calidad.temperatura.max=${CALIDAD_TEMPERATURA_MAX:8.00}
app.calidad.acidez.min=${CALIDAD_ACIDEZ_MIN:14.00}
app.calidad.acidez.max=${CALIDAD_ACIDEZ_MAX:18.00}
app.calidad.densidad.min=${CALIDAD_DENSIDAD_MIN:1.0280}
app.calidad.densidad.max=${CALIDAD_DENSIDAD_MAX:1.0340}

# Flyway owns the schema; Hibernate only validates existing tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
